name: Filtre grandes valeurs en baisse

on:
  workflow_dispatch:
    inputs:
      liste:
        description: "Tickers séparés par des espaces (vide = liste par défaut)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: cours
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet curl_cffi
      - run: cd scripts && python3 screen.py /tmp/screen.json ${{ inputs.liste }}
      - name: Publication sur la branche « cours »
        run: |
          git clone -q --depth 1 --branch cours "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/pub
          cd /tmp/pub && mkdir -p donnees && cp /tmp/screen.json donnees/screen.json
          git add donnees/screen.json
          git -c user.name="vigie-bot" -c user.email="vigie-bot@users.noreply.github.com" commit -q -m "Filtre du $(date -u +'%Y-%m-%d %H:%M')" || echo "rien"
          git push -q origin cours
