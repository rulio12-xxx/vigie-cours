name: Cours du jour

# Toutes les 10 minutes, du lundi au vendredi, 6h-20h50 UTC
# (couvre Paris 9h-17h35 et New York 15h30-22h, heure d'été comme d'hiver). 
on:
  schedule:
    - cron: "7,17,27,37,47,57 6-20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cours
  cancel-in-progress: false

jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Dépendance (imitation navigateur)
        run: pip install --quiet curl_cffi
      - name: Relevé Yahoo Finance
        run: python3 scripts/cours.py /tmp/cours.json
      - name: Indicateurs de risque de marché (S&P 500, VIX, courbe des taux)
        run: cd scripts && python3 risque.py /tmp/risque.json || echo "risque indisponible"
      - name: Publication sur la branche « cours » (cours.json + relevé du créneau)
        run: |
          git clone -q --depth 1 --branch cours "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/pub \
            || { mkdir /tmp/pub && cd /tmp/pub && git init -q -b cours && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"; }
          cd /tmp/pub
          mkdir -p donnees/releves
          cp /tmp/cours.json donnees/cours.json
          [ -f /tmp/risque.json ] && cp /tmp/risque.json donnees/risque.json || true
          cp /tmp/releves/*.txt donnees/releves/
          ( cd "$GITHUB_WORKSPACE/scripts" && python3 baisse.py /tmp/cours.json /tmp/pub/donnees/releves /tmp/pub/donnees/quotidien.json /tmp/pub/donnees/baisse.json ) || echo "baisse indisponible"
          # garde 10 jours de relevés
          find donnees/releves -name '*.txt' -mtime +10 -delete || true
          ls donnees/releves | sort | head -n -40 | sed 's#^#donnees/releves/#' | xargs -r git rm -q || true
          git add -A donnees
          git -c user.name="vigie-bot" -c user.email="vigie-bot@users.noreply.github.com" \
              commit -q -m "Cours du $(date -u +'%Y-%m-%d %H:%M') UTC" || echo "rien à publier"
          git push -q origin cours
