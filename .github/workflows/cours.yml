name: Cours du jour

# Toutes les 10 minutes, du lundi au vendredi, 6h-20h50 UTC
# (couvre Paris 9h-17h35 et New York 15h30-22h, heure d'été comme d'hiver).
on:
  schedule:
    - cron: "7,17,27,37,47,57 6-20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cours
  cancel-in-progress: false

jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Dépendance (imitation navigateur)
        run: pip install --quiet curl_cffi
      - name: Relevé Yahoo Finance
        run: python3 scripts/cours.py /tmp/cours.json
      - name: Publication sur la branche « cours » (un seul commit, écrasé à chaque relevé)
        run: |
          mkdir /tmp/pub && cd /tmp/pub
          git init -q -b cours
          mkdir donnees && cp /tmp/cours.json donnees/cours.json
          git add donnees/cours.json
          git -c user.name="vigie-bot" -c user.email="vigie-bot@users.noreply.github.com" \
              commit -q -m "Cours du $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" cours
